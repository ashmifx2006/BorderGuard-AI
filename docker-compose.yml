services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./media:/media
    ports:
      - "8000:8000"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./media:/media:ro
    depends_on:
      - backend
